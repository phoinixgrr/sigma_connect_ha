name: HACS Validation

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  hacs:
    name: HACS Action
    runs-on: "ubuntu-24.04"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: HACS Validation
        uses: hacs/action@main
        with:
          category: "integration"

